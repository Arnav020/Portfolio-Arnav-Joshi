<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scroll-Linked Image Sequence</title>

<!-- GSAP + ScrollTrigger via CDN — the only external dependency. -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* ---- Demo-only filler so you can see the pin kick in on scroll ----
     Delete these two blocks (and the two <section class="demo-filler">
     elements in the body) once you drop the sequence into your real page. */
  .demo-filler {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* ---- The actual component ---- */
  .sequence-section {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #000; /* letterbox color, shows briefly if the section is wider/taller than the source footage */
  }

  #sequence-canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  .sequence-loader {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #000;
    color: #fff;
    transition: opacity 0.4s ease;
  }
  .sequence-loader.is-hidden {
    opacity: 0;
    pointer-events: none;
  }
  .sequence-loader-bar {
    width: 180px;
    height: 3px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.2);
    overflow: hidden;
  }
  .sequence-loader-fill {
    height: 100%;
    width: 0%;
    background: #fff;
    transition: width 0.15s ease-out;
  }
  .sequence-loader-text {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.6;
  }
</style>
</head>
<body>

<section class="demo-filler">Scroll down ↓ (demo filler — delete me)</section>

<section id="sequence-section" class="sequence-section">
  <canvas id="sequence-canvas"></canvas>

  <div id="sequence-loader" class="sequence-loader">
    <div class="sequence-loader-bar">
      <div id="sequence-loader-fill" class="sequence-loader-fill"></div>
    </div>
    <p id="sequence-loader-text" class="sequence-loader-text">Loading 0%</p>
  </div>
</section>

<section class="demo-filler">Demo filler — delete me too</section>

<script>
(function () {
  'use strict';

  // ────────────────────────────────────────────────────────────────
  // CONFIG — the only things you should need to touch
  // ────────────────────────────────────────────────────────────────
  var FRAME_COUNT = 300;                 // total number of frames on disk
  var FRAME_PATH = function (n) {        // 1-indexed, matches ezgif-frame-001.jpg ... 300.jpg
    return 'frames/ezgif-frame-' + String(n).padStart(3, '0') + '.jpg';
  };
  var SCROLL_DISTANCE = window.innerHeight * 4; // how much scroll it takes to play the whole sequence
  var SCRUB = 0.5;                       // seconds of smoothing lag between scroll and frame — 0 = rigid/stuttery, higher = floatier

  var section = document.getElementById('sequence-section');
  var canvas = document.getElementById('sequence-canvas');
  var ctx = canvas.getContext('2d');
  var loader = document.getElementById('sequence-loader');
  var loaderFill = document.getElementById('sequence-loader-fill');
  var loaderText = document.getElementById('sequence-loader-text');

  var images = new Array(FRAME_COUNT);
  var current = { index: -1 };
  var dpr = 1;

  var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ────────────────────────────────────────────────────────────────
  // Canvas sizing — retina-sharp, resizes with the section
  // ────────────────────────────────────────────────────────────────
  // Lock the section's height in JS rather than trusting CSS `100vh`. Mobile
  // Safari/Chrome resize the visual viewport (and therefore `vh`) as the
  // address bar shows/hides, which can make GSAP snapshot a stale or even
  // zero height at the exact moment it freezes the pinned element's inline
  // size. window.innerHeight, read fresh on load/resize, doesn't have that
  // problem.
  function setSectionHeight() {
    section.style.height = window.innerHeight + 'px';
  }

  function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2); // cap at 2x, no need to push 3x mobile pixels through the GPU
    setSectionHeight();
    var rect = section.getBoundingClientRect();
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawFrame(Math.max(current.index, 0), true);
    if (typeof ScrollTrigger !== 'undefined') ScrollTrigger.refresh();
  }

  // object-fit: cover math — fills the canvas and crops, centered, on any aspect ratio.
  // This is what keeps the sequence looking sharp and centered on mobile portrait screens
  // even though the source frames are 16:9.
  function drawFrame(index, force) {
    if (!force && index === current.index) return;
    var img = images[index];
    if (!img || !img.complete || img.naturalWidth === 0) return;

    var cw = canvas.width / dpr;
    var ch = canvas.height / dpr;
    var scale = Math.max(cw / img.naturalWidth, ch / img.naturalHeight);
    var dw = img.naturalWidth * scale;
    var dh = img.naturalHeight * scale;
    var dx = (cw - dw) / 2;
    var dy = (ch - dh) / 2;

    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(img, dx, dy, dw, dh);
    current.index = index;
  }

  // ────────────────────────────────────────────────────────────────
  // Preload every frame before wiring up any scroll behavior
  // ────────────────────────────────────────────────────────────────
  function preloadFrames() {
    return new Promise(function (resolve) {
      var settled = 0;

      function onSettle() {
        settled++;
        var pct = Math.round((settled / FRAME_COUNT) * 100);
        loaderFill.style.width = pct + '%';
        loaderText.textContent = 'Loading ' + pct + '%';
        if (settled === FRAME_COUNT) resolve();
      }

      for (var i = 0; i < FRAME_COUNT; i++) {
        var img = new Image();
        img.decoding = 'async';
        img.onload = onSettle;
        img.onerror = onSettle; // don't let one missing frame hang the whole sequence forever
        img.src = FRAME_PATH(i + 1);
        images[i] = img;
      }
    });
  }

  function hideLoader() {
    loader.classList.add('is-hidden');
    setTimeout(function () {
      loader.style.display = 'none';
    }, 400);
  }

  function debounce(fn, wait) {
    var t;
    return function () {
      clearTimeout(t);
      t = setTimeout(fn, wait);
    };
  }

  // ────────────────────────────────────────────────────────────────
  // Init
  // ────────────────────────────────────────────────────────────────
  function init() {
    resizeCanvas();
    drawFrame(0, true);
    hideLoader();

    window.addEventListener('resize', debounce(resizeCanvas, 150));

    if (prefersReducedMotion) {
      // Respect reduced motion: show a representative frame, skip the scroll-jacked pin entirely.
      drawFrame(Math.floor(FRAME_COUNT / 2), true);
      return;
    }

    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
      // GSAP failed to load (e.g. CDN blocked) — fail gracefully with a static first frame
      // instead of a broken page.
      console.warn('GSAP/ScrollTrigger not found — scroll sequence will stay static.');
      return;
    }

    gsap.registerPlugin(ScrollTrigger);

    var proxy = { frame: 0 };
    gsap.to(proxy, {
      frame: FRAME_COUNT - 1,
      ease: 'none',
      onUpdate: function () {
        drawFrame(Math.round(proxy.frame));
      },
      scrollTrigger: {
        trigger: section,
        start: 'top top',
        end: '+=' + SCROLL_DISTANCE,
        scrub: SCRUB,
        pin: true,
        anticipatePin: 1,
        invalidateOnRefresh: true,
        // markers: true, // uncomment while tuning start/end/distance
      },
    });
  }

  preloadFrames().then(init);
})();
</script>

</body>
</html>
